; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
    src_dir = main
    default_envs = esp32cam

[common:idf]
    build_flags = 
        -DUSE_ESP_IDF
    lib_deps =

[common:esp32-idf]
    extends = common:idf
    ; PlatformIO releases, see https://github.com/platformio/platform-espressif32/releases
    platform = platformio/espressif32 @ 6.11.0
    framework = espidf
    lib_deps = 
        ${common:idf.lib_deps}
    build_flags = 
        ${common:idf.build_flags}
        -Wno-nonnull-compare
        -DUSE_ESP32
        -DUSE_ESP32_FRAMEWORK_ESP_IDF

[flags:runtime]
    build_flags = 
        -Wno-nonnull-compare
        -Wno-sign-compare
        -Wno-unused-but-set-variable
        -Wno-unused-variable
        -fno-exceptions

[flags:clangtidy]
    build_flags = 
        -Wall
        -Wextra
        -Wunreachable-code
        ;-Wshadow-compatible-local
        -fno-exceptions

; The main env - default
[env:esp32cam]
extends = common:esp32-idf
board = esp32cam
framework = espidf
build_flags = 
    ; ### common imported : 
    ${common:esp32-idf.build_flags}
	${flags:runtime.build_flags}
    ; ### Sofware options : (can be set in defines.h)
    -D BOARD_ESP32CAM_AITHINKER
    -D ENABLE_MQTT
    ;-D MQTT_PROTOCOL_311
    -D MQTT_ENABLE_SSL
    ;-D MQTT_ENABLE_WS
    ;-D MQTT_ENABLE_WSS
    -D MQTT_SUPPORTED_FEATURE_SKIP_CRT_CMN_NAME_CHECK
    ;-D MQTT_SUPPORTED_FEATURE_CRT_CMN_NAME
    ;-D MQTT_SUPPORTED_FEATURE_CLIENT_KEY_PASSWORD
    -D ENABLE_INFLUXDB
    -D ENABLE_WEBHOOK
    -D ENABLE_SOFTAP 
board_build.partitions = partitions.csv
monitor_speed = 115200
